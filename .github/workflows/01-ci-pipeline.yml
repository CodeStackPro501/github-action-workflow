# ──────────────────────────────────────────────────────────────────────────────
# CI PIPELINE — GitHub Actions Tutorial
# Trigger: push / pull_request → main  |  Manual via workflow_dispatch
#
# Jobs:
#   1. lint    → Syntax audit of all JS files
#   2. test    → Jest matrix across Node 18 / 20 / 22  (needs: lint)
#   3. summary → Writes Markdown report to the Actions dashboard (needs: test)
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]        # runs only when code is merged to main
  workflow_dispatch:        # manual "Run workflow" button in GitHub UI

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm' # Restores node_modules from cache → faster builds

      - name: Install dependencies
        run: npm ci # Uses package-lock.json — deterministic, faster than npm install

      - name: Run syntax check
        run: npm run lint

      - name: Check code formatting (Prettier)
        run: npm run format:check

  # ── Job 2: Test Matrix ──────────────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: lint # Only runs if lint passes

    strategy:
      fail-fast: false # Don't cancel other matrix jobs if one fails
      matrix:
        node: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest test suite
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: matrix.node == '20.x' # Upload once, from the primary Node version
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Job 3: CI Summary ───────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: test
    if: always() # Run even when test job fails — so we always see a report

    steps:
      - name: Write step summary
        run: |
          echo "## CI Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (18/20/22) | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Artifact | Uploaded (Node 20) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }} · \`${{ github.ref_name }}\` · \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
